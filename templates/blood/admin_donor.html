{% extends 'blood/adminbase.html' %}
{% block content %}
{% load widget_tweaks %}
{% load static %}

<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            padding-bottom: 50px;
        }

        
        .section-title {
            color: #555;
            font-weight: 600;
            margin-bottom: 20px;
            margin-top: 30px;
            border-left: 5px solid #d9534f;
            padding-left: 15px;
        }


        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            background: #fff;
            padding: 20px;
            overflow: hidden;
        }

      
        .table {
            margin-bottom: 0;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table thead th {
            border: none;
            background-color: #f8f9fa;
            color: #777;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            padding: 15px;
        }

        
        .table tbody tr {
            transition: background-color 0.2s;
        }

        .table tbody tr:hover {
            background-color: #f9f9f9;
        }

        .table td {
            border-top: 1px solid #f0f0f0;
            vertical-align: middle;
            padding: 15px;
            color: #555;
            font-weight: 400;
        }

        .profile-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        
        .blood-badge {
            background-color: #ffebee;
            color: #d9534f;
            padding: 5px 10px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        
        .btn-action {
            padding: 6px 15px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
            margin: 0 2px;
        }

        .btn-edit {
            background-color: #4099ff;
            color: white;
            border: none;
        }
        .btn-edit:hover { background-color: #308ce6; color: white; text-decoration: none; }

        .btn-delete {
            background-color: #ff5370;
            color: white;
            border: none;
        }
        .btn-delete:hover { background-color: #e04460; color: white; text-decoration: none; }

    </style>
</head>

<div class="container">
    
    <h3 class="section-title">Donor Details</h3>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Profile</th>
                        <th scope="col">Blood Group</th>
                        <th scope="col">Address</th>
                        <th scope="col">Mobile</th>
                        <th scope="col" class="text-right">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for t in donors %}
                    <tr>
                        <td style="font-weight: 500;">{{t.get_name}}</td>
                        <td>
                            <img src="{% static t.profile_pic.url %}" alt="Profile" class="profile-avatar" />
                        </td>
                        <td><span class="blood-badge">{{t.bloodgroup}}</span></td>
                        <td>{{t.address}}</td>
                        <td>{{t.mobile}}</td>
                        
                        <td class="text-right">
                            <a href="{% url 'update-donor' t.id %}" class="btn-action btn-edit">
                                <i class="fas fa-edit"></i> Edit
                            </a>
                            <a href="{% url 'delete-donor' t.id %}" class="btn-action btn-delete" onclick="return confirm('Are you sure you want to delete this donor?');">
                                <i class="fas fa-trash-alt"></i> Delete
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

{% endblock content %}
