{% extends 'donor/donorbase.html' %}
{% block content %}
{% load static %}

<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            padding-top: 30px;
            padding-bottom: 50px;
        }

        
        .dashboard-card {
            background: #fff;
            border-radius: 10px;
            padding: 25px 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border-left: 5px solid transparent;
            position: relative;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .card-content {
            z-index: 2;
        }

        .card-title {
            color: #777;
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .card-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #333;
            line-height: 1.2;
        }

        .card-icon {
            font-size: 3rem;
            opacity: 0.15;
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

      
        .card-blue {
            border-left-color: #4facfe;
        }
        .card-blue .card-icon { color: #4facfe; }
        .card-blue .card-value { color: #4facfe; }

        
        .card-orange {
            border-left-color: #ff9800;
        }
        .card-orange .card-icon { color: #ff9800; }
        .card-orange .card-value { color: #ff9800; }

        
        .card-green {
            border-left-color: #00c853;
        }
        .card-green .card-icon { color: #00c853; }
        .card-green .card-value { color: #00c853; }

       
        .card-red {
            border-left-color: #f44336;
        }
        .card-red .card-icon { color: #f44336; }
        .card-red .card-value { color: #f44336; }

    </style>
</head>

<div class="container">
    <div class="row">

        <div class="col-sm-6 col-lg-3">
            <div class="dashboard-card card-blue">
                <div class="card-content">
                    <div class="card-title">Requests Made</div>
                    <div class="card-value">{{requestmade}}</div>
                </div>
                <div class="card-icon">
                    <i class="fas fa-clipboard-list"></i>
                </div>
            </div>
        </div>

        <div class="col-sm-6 col-lg-3">
            <div class="dashboard-card card-orange">
                <div class="card-content">
                    <div class="card-title">Pending</div>
                    <div class="card-value">{{requestpending}}</div>
                </div>
                <div class="card-icon">
                    <i class="fas fa-hourglass-half"></i>
                </div>
            </div>
        </div>

        <div class="col-sm-6 col-lg-3">
            <div class="dashboard-card card-green">
                <div class="card-content">
                    <div class="card-title">Approved</div>
                    <div class="card-value">{{requestapproved}}</div>
                </div>
                <div class="card-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
            </div>
        </div>

        <div class="col-sm-6 col-lg-3">
            <div class="dashboard-card card-red">
                <div class="card-content">
                    <div class="card-title">Rejected</div>
                    <div class="card-value">{{requestrejected}}</div>
                </div>
                <div class="card-icon">
                    <i class="fas fa-times-circle"></i>
                </div>
            </div>
        </div>

    </div>
</div>

{% endblock content %}
