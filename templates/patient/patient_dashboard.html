{% extends 'patient/patientbase.html' %}
{% block content %}
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f3f5f9;
            font-family: 'Poppins', sans-serif;
        }

        .dashboard-container {
            padding: 40px 20px;
        }

        
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: #fff;
            text-align: center;
            margin-bottom: 20px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .card-body {
            padding: 30px 20px;
        }

        .xyz {     
            color: #d9534f; 
            font-size: 40px;
            margin-bottom: 15px;
            display: inline-block;
        }

       
        .stat-label {
            font-size: 14px;
            font-weight: 600;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            display: block;
        }

        
        .row {
            margin-top: 20px;
        }
    </style>
</head>

<div class="container dashboard-container">
    <div class="row">
        <div class="col-md-3 col-sm-6">
            <div class="card">
                <div class="card-body">
                    <i class="fas fa-sync-alt xyz"></i>
                    <div class="stat-label">Requests Made</div>
                    <span class="stat-value">{{requestmade}}</span>
                </div>
            </div>
        </div>

        <div class="col-md-3 col-sm-6">
            <div class="card">
                <div class="card-body">
                    <i class="fas fa-history xyz"></i>
                    <div class="stat-label">Pending</div>
                    <span class="stat-value">{{requestpending}}</span>
                </div>
            </div>
        </div>

        <div class="col-md-3 col-sm-6">
            <div class="card">
                <div class="card-body">
                    <i class="fas fa-check-circle xyz"></i>
                    <div class="stat-label">Approved</div>
                    <span class="stat-value">{{requestapproved}}</span>
                </div>
            </div>
        </div>

        <div class="col-md-3 col-sm-6">
            <div class="card">
                <div class="card-body">
                    <i class="fas fa-times-circle xyz"></i>
                    <div class="stat-label">Rejected</div>
                    <span class="stat-value">{{requestrejected}}</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
