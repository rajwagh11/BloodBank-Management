<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard - Blood Bank</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        
        .navbar {
            background-color: #fff;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            padding: 10px 30px;
            z-index: 1000;
            height: 70px;
        }

        .navbar-brand {
            font-weight: 700;
            color: #d9534f !important; 
            font-size: 1.4rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }

        .navbar-brand i {
            font-size: 1.8rem;
            margin-right: 10px;
        }

        .btn-logout {
            background-color: #d9534f;
            color: white !important;
            padding: 8px 25px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(217, 83, 79, 0.2);
        }

        .btn-logout:hover {
            background-color: #c9302c;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(217, 83, 79, 0.3);
            text-decoration: none;
        }

        
        .sidebar {
            width: 260px;
            height: calc(100vh - 70px);
            background: #343a40;
            position: fixed;
            top: 70px;
            left: 0;
            padding-top: 20px;
            transition: all 0.3s;
            z-index: 900;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar ul li a {
            padding: 15px 25px;
            font-size: 1rem;
            font-weight: 400;
            color: #adb5bd;
            display: flex;
            align-items: center;
            text-decoration: none;
            border-left: 4px solid transparent;
            transition: all 0.3s;
        }

        .sidebar ul li a i {
            width: 35px;
            font-size: 1.1rem;
        }

        .sidebar ul li a:hover, 
        .sidebar ul li a.active {
            color: #fff;
            background-color: #3e444a;
            border-left: 4px solid #d9534f;
        }

       
        .main-content {
            margin-left: 260px;
            margin-top: 70px;
            padding: 30px;
            min-height: calc(100vh - 70px);
            transition: all 0.3s;
        }

        
        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }
            .sidebar ul li a span {
                display: none;
            }
            .sidebar ul li a {
                padding: 15px;
                justify-content: center;
            }
            .sidebar ul li a i {
                width: auto;
                margin: 0;
            }
            .main-content {
                margin-left: 70px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top">
        <a class="navbar-brand" href="/">
            <i class="fas fa-heartbeat"></i> 
            <span>Patient Portal</span>
        </a>
        
        <div class="ml-auto">
            <a class="btn-logout" href="/logout">
                Logout <i class="fas fa-sign-out-alt ml-1"></i>
            </a>
        </div>
    </nav>

    <div class="sidebar">
        <ul>
            <li>
                <a href="/">
                    <i class="fas fa-home"></i> <span>Home</span>
                </a>
            </li>
            <li>
                <a href="/patient/make-request">
                    <i class="fas fa-plus-circle"></i> <span>Make Request</span>
                </a>
            </li>
            <li>
                <a href="/patient/my-request">
                    <i class="fas fa-history"></i> <span>Request History</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        {% block content %}
        {% endblock content %}
    </div>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

    <script>
        $(document).ready(function() {
            var path = window.location.pathname;
            $('.sidebar ul li a').each(function() {
                var href = $(this).attr('href');
                if (path === href) {
                    $(this).addClass('active');
                }
            });
        });
    </script>

</body>
</html>
